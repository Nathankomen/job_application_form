<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Join Our Team</h1>
      <form>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required>

        <label for="position">Position</label>
        <select id="position" name="position" required>
          <option value="">-- Choose a position --</option>
          <option value="frontend">Frontend Developer</option>
          <option value="backend">Backend Developer</option>
          <option value="designer">UI/UX Designer</option>
          <option value="qa">QA Engineer</option>
        </select>

        <fieldset class="radio-group">
          <legend>Availability</legend>

          <input type="radio" id="full-time" name="availability" value="full-time" required>
          <label for="full-time">Full-Time</label>

          <input type="radio" id="part-time" name="availability" value="part-time">
          <label for="part-time">Part-Time</label>

          <input type="radio" id="contract" name="availability" value="contract">
          <label for="contract">Contract</label>
        </fieldset>

        <label for="message">Why do you want to work with us?</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us a bit about yourself..." required></textarea>

        <button type="submit">Submit Application</button>
      </form>
    </div>
  </body>
</html>
